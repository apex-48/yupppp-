<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Date Invite 💗</title>
<style>
:root{
  --pink:#e91e8f; --soft:#f7eef0; --ink:#65484a; --muted:#a78689;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif}
body{
  min-height:100vh;display:grid;place-items:center;overflow:hidden;
  background:
    radial-gradient(circle at 15% 15%,#fff 0 2px,transparent 3px),
    radial-gradient(circle at 82% 30%,#f3cbd4 0 2px,transparent 3px),
    radial-gradient(circle at 65% 78%,#fff 0 2px,transparent 3px),
    #f8eef0;
  background-size:140px 140px,180px 180px,210px 210px,auto;
}
.app{width:min(92vw,460px);padding:20px;position:relative}
.card{
  position:relative;background:rgba(255,255,255,.92);border:1px solid #ead9dd;
  border-radius:14px;padding:28px 25px 24px;text-align:center;
  box-shadow:0 18px 50px rgba(117,71,82,.14);
  min-height:300px;display:flex;flex-direction:column;justify-content:center;
}
.card.enter{animation:cardIn .55s cubic-bezier(.2,.8,.2,1)}
@keyframes cardIn{
  0%{opacity:0;transform:translateY(18px) scale(.96)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
.icon{
  width:54px;height:54px;border-radius:12px;margin:0 auto 12px;
  display:grid;place-items:center;background:#f8e6ea;font-size:29px;
  animation:iconPop .7s cubic-bezier(.17,.89,.32,1.28);
}
@keyframes iconPop{0%{transform:scale(.5) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
h1{font-size:23px;line-height:1.2;margin:4px 0 9px;color:var(--ink)}
p{font-size:13px;line-height:1.55;color:var(--muted);margin:7px 0 15px}
button,input{
  font:inherit;border-radius:8px;width:100%;padding:11px 13px;
}
button{border:0;background:var(--pink);color:white;cursor:pointer;font-size:13px;
  box-shadow:0 7px 16px rgba(233,30,143,.18);transition:.18s}
button:hover{transform:translateY(-1px)}
button:active{transform:scale(.97)}
.no{background:#f4dfe4;color:#8c6268;box-shadow:none}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px}
.hidden{display:none!important}
.dog{width:62px;height:62px;object-fit:cover;border-radius:9px;margin:0 auto 10px;box-shadow:0 5px 15px #0001}
.fallback-dog{font-size:45px}
label{text-align:left;font-size:12px;color:#8e7074;margin:10px 0 5px;display:block}
input{border:1px solid #ead9dd;background:#fff;color:#6c5154;outline:none}
input:focus{border-color:#e99ab8;box-shadow:0 0 0 3px #e99ab833}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.food{
  background:#fff;border:1px solid #ead9dd;color:#73575a;box-shadow:none;padding:10px 4px;font-size:12px
}
.food.selected{border-color:#e91e8f;background:#fff0f7;box-shadow:0 0 0 2px #e91e8f22}
.big{font-size:25px;display:block;margin-bottom:2px}
.final{font-size:27px;margin-bottom:6px}
.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px #e91e8f12}}
.float{
  position:fixed;left:0;top:0;pointer-events:none;z-index:5;
  animation:floatUp 2.8s ease-out forwards;font-size:18px;
}
@keyframes floatUp{
  0%{opacity:0;transform:translate3d(0,30px,0) scale(.6) rotate(0)}
  12%{opacity:1}
  100%{opacity:0;transform:translate3d(var(--dx),-105vh,0) scale(1.2) rotate(28deg)}
}
.spark{
  position:fixed;width:5px;height:5px;border-radius:50%;background:#e99ab8;
  pointer-events:none;z-index:4;animation:spark .9s ease-out forwards;
}
@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
.shake{animation:shake .42s}
@keyframes shake{
  20%{transform:translateX(-5px)}40%{transform:translateX(5px)}
  60%{transform:translateX(-4px)}80%{transform:translateX(4px)}
}
.tiny{font-size:11px;color:#b28e92}
</style>
</head>
<body>
<main class="app">
  <section id="card" class="card enter"></section>
</main>

function render(content){
  const card=document.getElementById("card");
  card.classList.remove("enter");
  void card.offsetWidth;
  card.classList.add("enter");
  card.innerHTML=content;
}

    e.style.top=(78+Math.random()*18)+"vh";

    e.style.animationDelay=(Math.random()*.9)+"s";
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),3500);
  }
}
function burst(){
  for(let i=0;i<18;i++){
    const s=document.createElement("div");s.className="spark";
    s.style.left="50%";s.style.top="50%";
    s.style.setProperty("--x",((Math.random()-.5)*260)+"px");
    s.style.setProperty("--y",((Math.random()-.5)*220)+"px");
    document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
  }
}
function first(){
 render(`
   ${dogImage ? `<img class="dog" src="data:image/jpeg;base64,${dogImage}">` : `<div class="fallback-dog">🐶</div>`}
   <h1>🌸 Will you go on a date with me? 🌸</h1>
   <p>Be honest... but choose carefully 👀</p>
   <div class="btns">
     <button onclick="yes1()">YES 💗</button>
     <button class="no" id="noBtn" onclick="nope()">NO 😭</button>
   </div>
 `);
}
function nope(){
 const b=document.getElementById("noBtn");
 b.classList.add("shake");
 setTimeout(()=>b.classList.remove("shake"),450);
 b.innerText=["Are you sure? 🥺","Think again 😭","Wrong button 😭","NO is not available 😌"][Math.floor(Math.random()*4)];
}
function yes1(){
 burst();hearts(14);
 setTimeout(step2,320);
}
function step2(){
 render(`
   <div class="icon">💊</div>
   <h1>WAIT YOU ACTUALLY<br>SAID YES??</h1>
   <p>I knew you were too cute to say no 😭💗</p>
   <button onclick="step3()">okayyy 💕</button>
 `);
}
function step3(){
 render(`
   <div class="icon">📅</div>
   <h1>So... when are you free?</h1>
   <p>Pick a day and time for our date ✨</p>
   <label>Pick a Day 📆</label>
   <input id="date" type="date">
   <label>What Time? ⏰</label>
   <input id="time" type="time">
   <button onclick="saveDate()">Next 💗</button>
 `);
}
function saveDate(){
 const d=document.getElementById("date").value,t=document.getElementById("time").value;
 if(!d||!t){alert("Date aur time select karo 😌");return}
 dateValue=d;timeValue=t;step4();
}
function step4(){
 render(`
   <div class="icon">🍽️</div>
   <h1>What are we feeling? 🍴</h1>
   <p>Pick your date mood</p>
   <div class="grid">
     ${moods.map((m,i)=>`<button class="food" onclick="pickMood(this,'${m[1]}')"><span class="big">${m[0]}</span>${m[1]}</button>`).join("")}
   </div>
   <button onclick="step5()">Continue 💕</button>
 `);
}
function pickMood(el,m){document.querySelectorAll(".food").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");mood=m}
function step5(){
 if(!mood){alert("Ek option choose karo 💗");return}
 render(`
   <div class="final">💌</div>
   <h1>glad you didn't say no.</h1>
   <p>I promise it'll be worth it. Food, laughs, and me trying to impress you 😭💗</p>
   <p class="tiny">Date: ${pretty(dateValue,timeValue)}<br>Plan: ${mood}</p>
   <button class="pulse" onclick="confirmDate()">it's a date 💗</button>
 `);
}
function pretty(d,t){
 const x=new Date(d+"T"+t);
 return x.toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"});
}
function confirmDate(){
 burst();hearts(40);
 setTimeout(()=>{
  render(`
    <div class="final">💖</div>
    <h1>DATE CONFIRMED!</h1>
    <p><b>${pretty(dateValue,timeValue)}</b><br>${mood} ✨</p>
    <p>See you soon, cutie 🫶</p>
    <button onclick="hearts(35)">send love 💕</button>
  `);
 },250);
}
first();
</script>
</body>
</html>
